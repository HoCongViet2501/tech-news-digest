# Part 2 ingestion sources (docs/PLAN.md §11, §13 Ingestion).
# Approved by the owner on 2026-11-15. Feeds were probed on 2026-11-15; URLs are the
# final ones after redirects. base_weight (0-100) stands in for popularity, since RSS
# has no votes: lower for high-volume or marketing-heavy feeds.
# cadence_hours defaults to 24 for RSS. Weekly newsletters (Node/JS/Postgres Weekly)
# yield one item per issue.
# The Part 1 Telegram digest still reads sources from config.yaml, not from this file.

defaults:
  rss:
    cadence_hours: 24


timezone: Asia/Ho_Chi_Minh
max_items: 10

profile: |
  Full-stack developer who also does DevOps (TypeScript/JavaScript, Python, Go, Java; Docker, Kubernetes, CI/CD, cloud).
  Backend stack: Java/Spring, Node.js, Kafka and messaging, databases (PostgreSQL, MySQL, Redis, MongoDB),
  distributed systems and system design.
  Interested in: new AI technology and models, AI-powered developer tools (coding agents, MCP, LLM tooling),
  trending open-source projects on GitHub, practical full-stack, backend and DevOps tools, releases and techniques
  that make day-to-day work faster.
  Not interested in: crypto, hiring/layoff drama, funding news, pure marketing or opinion pieces without technical depth.

sources:
  hackernews: {enabled: true, min_points: 50}
  github_trending: {enabled: true, languages: [python, go, typescript], min_stars_today: 50}
  lobsters: {enabled: true, min_score: 10}
  # Disabled: anonymous JSON API now redirects to login / 403. See docs/IDEAS.md.
  reddit: {enabled: false, subreddits: [programming, golang, Python], min_score: 100}
  rss: []   # entries like {name: ..., url: ..., base_score: 60}

filters:
  keywords_include: [llm, mcp, agent, kubernetes, docker, terraform, postgres]   # always kept, even below threshold
  keywords_exclude: [crypto, bitcoin, nft]
  seen_retention_days: 60

ai:
  enabled: true
  output_language: vi       # summaries and reasons are written in Vietnamese
  providers:                # tried in order; on failure move to the next
    - name: gemini
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      model: gemini-3.5-flash-lite
      api_key_env: GEMINI_API_KEY
    - name: groq
      base_url: https://api.groq.com/openai/v1
      model: openai/gpt-oss-120b
      api_key_env: GROQ_API_KEY
    - name: openrouter
      base_url: https://openrouter.ai/api/v1
      model: nvidia/nemotron-3-super-120b-a12b:free
      api_key_env: OPENROUTER_API_KEY

delivery:
  telegram: {enabled: true}
  pages: {enabled: true, base_url: "https://hocongviet2501.github.io/tech-news-digest/"}

# Part 2 content store: `python -m digest ingest` (ingest.yml, every 3 h).
# Sources for it live in sources.yaml.
ingest:
  enrich_per_run: 150       # pages fetched for og:image / description / language per run
  concurrency: 8            # sources (and enrichment pages) in flight at once
  per_host: 2               # at most this many in flight per host
  enrich_timeout_s: 10
  due_slack_minutes: 15     # a source is due this early, to absorb cron start jitter
  pop_window_days: 7        # pop_pct = per-source percentile of native_score over this window
  rss_max_age_days: 30      # skip older RSS entries, so a first fetch never imports whole archives
  github_search:
    days: 7                 # repos created in the last N days
    max_fork_ratio: 0.5     # forks > ratio x stars: bot forks
    min_fork_ratio: 0.005   # with >= zero_fork_min_stars stars, fewer forks: bought stars
    zero_fork_min_stars: 200
  llm_calls_per_run: 20     # LLM tag + quality batches (20 items each) per run
  embed:                    # local embeddings with fastembed (docs/PLAN.md §13)
    model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    cache_dir: .cache/fastembed   # ingest.yml caches this with actions/cache
    batch_size: 64
    per_run: 2000           # enriched items embedded per run (title + description)
    max_chars: 1000         # the model reads 128 tokens anyway
  tagging:                  # four-step tagger (docs/PLAN.md §15), stops when confident
    per_run: 2000
    native_confidence: 0.95 # source tag -> taxonomy alias
    rule_confidence: 0.9    # keyword regex in the title
    rule_description_confidence: 0.7  # keyword only in the description: tentative
    confident: 0.8          # a tag at or above this skips the embedding and LLM steps
    # Cosine vs. the description of `embed: true` tags. Calibrated on 1000 real items:
    # at 0.5 about a third of hits were wrong, at 0.55 most were right.
    embed_threshold: 0.55
    embed_thresholds: {frontend: 0.7, crypto-web3: 0.6}
    embed_confidence_min: 0.6
    embed_confidence_max: 0.75
    embed_max_tags: 2
    # LLM fallback: only items with no confident tag whose best tag-description cosine
    # reaches this (below ~0.25 it is mostly sports, courts, space flights).
    llm_min_similarity: 0.25
    llm_batch_size: 20
    llm_confidence: 0.85
    llm_max_age_hours: 24   # an item waiting for the LLM gives up after this
    llm_description_chars: 300
  cluster:                  # near-duplicates (docs/PLAN.md §15 Dedupe)
    window_hours: 72
    title_threshold: 0.92   # title cosine, from transient title embeddings
    prefilter: 0.5          # stored-vector cosine a pair needs before titles are compared
  tldr:                     # TL;DR for the Popular pool (docs/PLAN.md §13 step 9, §15 LLM budget)
    pool_size: 100          # top N of popular_feed('popular'), one item per cluster
    calls_per_run: 2        # LLM batches per run (Gemini quota is shared with Telegram + tagger)
    batch_size: 10
    max_age_hours: 72       # a pool item still waiting for the LLM gives up after this
    input_chars: 1500       # article text sent per item (keeps a batch inside free-tier TPM)
    min_chars: 120          # less article/description text than this: skipped, not summarized
    max_chars: 600          # TL;DR length cap; longer answers are cut at a sentence end

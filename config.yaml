timezone: Asia/Ho_Chi_Minh
max_items: 10

profile: |
  Full-stack developer who also does DevOps (TypeScript/JavaScript, Python, Go; Docker, Kubernetes, CI/CD, cloud).
  Interested in: new AI technology and models, AI-powered developer tools (coding agents, MCP, LLM tooling),
  trending open-source projects on GitHub, practical full-stack and DevOps tools, releases and techniques
  that make day-to-day work faster.
  Not interested in: crypto, hiring/layoff drama, funding news, pure marketing or opinion pieces without technical depth.

sources:
  hackernews: {enabled: true, min_points: 50}
  github_trending: {enabled: true, languages: [python, go, typescript], min_stars_today: 50}
  lobsters: {enabled: true, min_score: 10}
  # Disabled: anonymous JSON API now redirects to login / 403. See docs/IDEAS.md.
  reddit: {enabled: false, subreddits: [programming, golang, Python], min_score: 100}
  rss: []   # entries like {name: ..., url: ..., base_score: 60}

filters:
  keywords_include: [llm, mcp, agent, kubernetes, docker, terraform, postgres]   # always kept, even below threshold
  keywords_exclude: [crypto, bitcoin, nft]
  seen_retention_days: 60

ai:
  enabled: true
  output_language: vi       # summaries and reasons are written in Vietnamese
  providers:                # tried in order; on failure move to the next
    - name: gemini
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      model: gemini-3.5-flash-lite
      api_key_env: GEMINI_API_KEY
    - name: groq
      base_url: https://api.groq.com/openai/v1
      model: openai/gpt-oss-120b
      api_key_env: GROQ_API_KEY
    - name: openrouter
      base_url: https://openrouter.ai/api/v1
      model: nvidia/nemotron-3-super-120b-a12b:free
      api_key_env: OPENROUTER_API_KEY

radar:
  enabled: true
  manifests:                # direct dependencies of these files are tracked
    - repo: hocongviet2501/tech-news-digest
      paths: [pyproject.toml]
  include_dev_dependencies: false
  ignore: []                # package names never reported
  release_max_age_days: 7   # older releases are never reported (keeps the first run quiet)
  max_entries: 15

feedback:
  enabled: true             # 👍/👎 buttons under each item, collected by feedback.yml every 3h
  window_days: 30           # only votes from the last 30 days are used
  max_examples: 15          # liked and disliked titles each, shown to the AI scorer
  source_weight_min: 0.5    # heuristic weight per source, from its like ratio
  source_weight_max: 1.5

weekly:                     # Sunday 08:00 recap (weekly.yml)
  top_items: 5
  max_profile_suggestions: 3   # AI suggests profile edits; config.yaml is never changed
  min_votes_for_suggestions: 5

delivery:
  telegram: {enabled: true}
  pages: {enabled: true, base_url: "https://hocongviet2501.github.io/tech-news-digest/"}

# Shared tag taxonomy for Part 2 (docs/PLAN.md §15 Tagging, W2 step 1).
# DRAFT 2026-11-15 — awaiting owner approval. Seeded into the `tags` table.
#
# Fields:
#   slug         stable id (a-z0-9-); never rename once users follow it
#   name         display name
#   parent       optional; following a parent also matches its children in tag_match
#   description  one sentence; used for embedding similarity (step 3) and shown in the UI
#   aliases      native tags from sources (dev.to, Lobsters, GitHub topics, HF keywords)
#                mapped to this slug (step 1, confidence 0.95); lowercase, exact match
#   keywords     case-insensitive regexes on title + description (step 2, confidence 0.9 in
#                the title, 0.7 when only the description matches); matched with word
#                boundaries; '(?-i:React)' makes one case-sensitive; kept conservative,
#                refined with the W2 eval set
#   embed        true = also eligible for embedding-based tagging (step 3); broad topics only
#
# Language and tool tags rely on aliases + keywords (+ LLM); the embedding experiment
# (§11) showed zero-shot embeddings are unreliable for them.

tags:
  # ---------------------------------------------------------------- AI
  - slug: ai
    name: AI & Machine Learning
    description: Artificial intelligence and machine learning, models, research and tooling.
    aliases: [artificial-intelligence, machinelearning, machine-learning, ml, deeplearning, deep-learning, genai, generative-ai]

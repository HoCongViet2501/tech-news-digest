name: ingest

# Content store ingestion (docs/PLAN.md §13): fetch due sources, enrich, embed,
# cluster, tag (+ LLM fallback), pop_pct.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Own group: ingest runs never overlap each other, and a pending ingest can never
# cancel the daily digest (daily only reads the DB, in its health step).
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  # Secrets cannot be read in a job-level `if`, so this job only reports
  # whether the DB secret is set. Until the owner adds it (human-only setup),
  # the ingest job is skipped instead of failing.
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          HAS_DB_URL: ${{ secrets.SUPABASE_DB_URL != '' }}
        run: |
          if [ "$HAS_DB_URL" = true ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_DB_URL is not configured; skipping ingest."
          fi

  ingest:
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --locked

      # The fastembed model (~0.24 GB) is downloaded once and kept with actions/cache.
      # The key names the model from config.yaml, so switching models starts a new cache.
      - name: Embedding model name
        id: embed
        run: |
          model=$(uv run python -c 'from pathlib import Path; from digest.config import load_config; print(load_config(Path("config.yaml")).ingest.embed.model)')
          echo "model=${model//\//-}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-${{ steps.embed.outputs.model }}

      # The DB URL (session pooler) is passed only through env, never inlined.
      # GITHUB_TOKEN raises the GitHub Search API rate limit; it is never logged.
      - name: Ingest
        run: uv run python -m digest ingest
        env:
          DIGEST_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          # LLM tag fallback + quality (free tiers); keys are never logged.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

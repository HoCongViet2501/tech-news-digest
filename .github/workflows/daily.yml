name: daily

on:
  schedule:
    - cron: "0 0 * * *" # 07:00 Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --locked

      - name: Run digest
        run: uv run python -m digest run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # The daily data/ commit also keeps scheduled workflows from being
      # disabled after 60 days without repository activity.
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d data ] && git add data/
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "digest: $(TZ=Asia/Ho_Chi_Minh date +%F)"
          git pull --rebase
          git push

      # site/ is absent when every source failed and only a warning was sent.
      - if: hashFiles('site/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - if: hashFiles('site/index.html') != ''
        id: deploy
        uses: actions/deploy-pages@v4

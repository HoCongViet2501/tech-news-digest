name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists PR files through the API

env:
  NEXT_TELEMETRY_DISABLED: "1"
  SUPABASE_TELEMETRY_DISABLED: "1"

jobs:
  # Decides which jobs run, so Python-only changes skip the web jobs and
  # web/DB-only changes skip pytest. data/ (daily digest commits) and docs
  # trigger nothing.
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.python.outputs.python }}
      web: ${{ steps.web.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: dorny/paths-filter@v4
        with:
          # A file counts only if it matches every pattern: anything outside
          # the excluded folders.
          predicate-quantifier: every
          filters: |
            python:
              - '**'
              - '!web/**'
              - '!supabase/**'
              - '!data/**'
              - '!docs/**'
              - '!**/*.md'
              - '!.github/workflows/db.yml'
      - id: web
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - 'web/**'
              - 'supabase/**'
              - '.github/workflows/ci.yml'

  test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # Supabase CLI comes from web/package.json (pinned devDependency).
      # Services nothing uses yet are excluded to keep startup fast.
      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,mailpit,logflare,vector,edge-runtime,supavisor,realtime,storage-api

      - name: Check DB types match migrations
        run: |
          # Nothing to check until the first migration exists (W1).
          if ! ls ../supabase/migrations/*.sql >/dev/null 2>&1; then
            echo "No migrations yet; skipping DB types check."
            exit 0
          fi
          pnpm db:types
          if [ -n "$(git status --porcelain -- src/lib/database.types.ts)" ]; then
            git diff -- src/lib/database.types.ts
            echo "::error file=web/src/lib/database.types.ts::DB types are out of date. Run 'pnpm db:start && pnpm db:types' in web/ and commit the result."
            exit 1
          fi
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: database-types
          path: web/src/lib/database.types.ts
          if-no-files-found: ignore

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
